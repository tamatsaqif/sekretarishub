<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kas Kelas — 9 SCP 2</title>
    <meta name="description" content="Sistem kas kelas 9 SCP 2" />
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  </head>
  <body>
    <canvas id="gridPulseCanvas" aria-hidden="true"></canvas>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <p class="brand-kicker">9 SCP 2</p>
          <h1>Kas Kelas</h1>
        </div>
        <div class="topbar-actions">
          <a href="/home" class="ghost-btn" style="text-decoration: none;">← Dashboard</a>
          <button id="loginBtn" class="secret-login-btn" type="button" title="Login" aria-label="Login">•••</button>
          <button id="logoutBtn" class="ghost-btn hidden" type="button">Keluar</button>
          <span id="adminBadge" class="admin-badge hidden">✏️ User</span>
        </div>
      </header>

      <main class="layout" style="gap: 24px;">
        <!-- Summary Cards -->
        <section class="panel" style="grid-column: 1 / -1;">
          <div class="panel-label">Ringkasan Kas</div>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 14px;">
            <div style="padding: 14px; background: rgba(226, 226, 224, 0.35); border-radius: 12px; border: 1px solid var(--line);">
              <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                <svg style="width: 18px; height: 18px; stroke: var(--accent);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="10"></circle>
                  <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path>
                  <path d="M12 18V6"></path>
                </svg>
                <div style="font-size: 0.8rem; color: var(--muted); font-weight: 600;">SALDO KAS</div>
              </div>
              <div id="balanceAmount" style="font-weight: 700; font-size: 1.5rem; color: var(--ink);">—</div>
            </div>
            <div style="padding: 14px; background: rgba(226, 226, 224, 0.35); border-radius: 12px; border: 1px solid var(--line);">
              <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                <svg style="width: 18px; height: 18px; stroke: var(--accent);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="12" y1="1" x2="12" y2="23"></line>
                  <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
                <div style="font-size: 0.8rem; color: var(--muted); font-weight: 600;">TOTAL PEMASUKAN</div>
              </div>
              <div id="totalIncome" style="font-weight: 700; font-size: 1.5rem; color: var(--ink);">—</div>
            </div>
            <div style="padding: 14px; background: rgba(226, 226, 224, 0.35); border-radius: 12px; border: 1px solid var(--line);">
              <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                <svg style="width: 18px; height: 18px; stroke: var(--accent);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
                <div style="font-size: 0.8rem; color: var(--muted); font-weight: 600;">TOTAL PENGELUARAN</div>
              </div>
              <div id="totalExpense" style="font-weight: 700; font-size: 1.5rem; color: var(--ink);">—</div>
            </div>
          </div>
        </section>

        <!-- Student Payments List -->
        <section class="panel" style="grid-column: 1 / -1;">
          <div class="section-head">
            <h3 style="display: flex; align-items: center; gap: 8px;">
              <svg style="width: 22px; height: 22px; stroke: currentColor;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path>
                <path d="M12 18V6"></path>
              </svg>
              <span>Pembayaran Siswa</span>
            </h3>
            <div class="head-actions">
              <button id="addPaymentBtn" class="primary-btn hidden" type="button">+ Catat Bayar</button>
              <button id="addExpenseBtn" class="ghost-btn hidden" type="button">+ Pengeluaran</button>
            </div>
          </div>

          <label class="search-box" for="studentSearch">
            <span>🔎</span>
            <input id="studentSearch" type="search" placeholder="Cari nama siswa" />
          </label>

          <div id="studentsContainer" style="display: grid; gap: 10px; margin-top: 12px;">
            <div class="empty-state">Memuat data...</div>
          </div>
        </section>
      </main>
    </div>

    <!-- Student Detail Modal -->
    <div id="studentDetailModal" class="modal hidden" aria-hidden="true">
      <div class="modal-card wide">
        <div class="modal-head">
          <h3 id="studentDetailName">Detail Siswa</h3>
          <button type="button" class="close-btn" data-close-modal="studentDetailModal">×</button>
        </div>

        <div style="display: grid; gap: 16px; margin-bottom: 16px;">
          <div style="display: flex; justify-content: space-between; padding: 12px; background: rgba(226, 226, 224, 0.35); border-radius: 10px;">
            <span style="font-weight: 600;">Total Dibayar</span>
            <span id="detailTotalPaid" style="font-weight: 700; font-size: 1.1rem;">—</span>
          </div>
          <div style="display: flex; justify-content: space-between; padding: 12px; background: rgba(226, 226, 224, 0.35); border-radius: 10px;">
            <span style="font-weight: 600;">Kekurangan</span>
            <span id="detailShortage" style="font-weight: 700; font-size: 1.1rem; color: var(--danger);">—</span>
          </div>
        </div>

        <div class="modal-body" id="paymentHistory">
          <div class="empty-state">Memuat riwayat...</div>
        </div>
      </div>
    </div>

    <!-- Add Payment Modal (Bendahara only) -->
    <div id="paymentModal" class="modal hidden" aria-hidden="true">
      <div class="modal-card">
        <div class="modal-head">
          <h3>Catat Pembayaran</h3>
          <button type="button" class="close-btn" data-close-modal="paymentModal">×</button>
        </div>

        <form id="paymentForm">
          <div class="field-group">
            <label for="paymentStudent">Pilih Siswa</label>
            <select id="paymentStudent" required style="border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: rgba(255, 255, 255, 0.9); font-size: 0.95rem; width: 100%;">
              <option value="">— Pilih siswa —</option>
            </select>
          </div>

          <div class="field-group">
            <label for="paymentWeek">Minggu Pembayaran</label>
            <select id="paymentWeek" required style="border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: rgba(255, 255, 255, 0.9); font-size: 0.95rem; width: 100%;">
              <option value="">— Pilih minggu —</option>
            </select>
          </div>

          <div class="field-group">
            <label for="paymentAmount">Nominal</label>
            <input id="paymentAmount" type="number" placeholder="5000" required style="border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: rgba(255, 255, 255, 0.9); font-size: 0.95rem; width: 100%;" />
          </div>

          <p id="paymentError" class="form-error hidden"></p>

          <div class="modal-actions">
            <button type="button" class="secondary-btn" data-close-modal="paymentModal">Batal</button>
            <button type="submit" class="primary-btn" id="paymentSubmitBtn">Tandai Sudah Bayar</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Add Expense Modal (Bendahara only) -->
    <div id="expenseModal" class="modal hidden" aria-hidden="true">
      <div class="modal-card">
        <div class="modal-head">
          <h3>Catat Pengeluaran</h3>
          <button type="button" class="close-btn" data-close-modal="expenseModal">×</button>
        </div>

        <form id="expenseForm">
          <div class="field-group">
            <label for="expenseAmount">Nominal</label>
            <input id="expenseAmount" type="number" placeholder="50000" required style="border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: rgba(255, 255, 255, 0.9); font-size: 0.95rem; width: 100%;" />
          </div>

          <div class="field-group">
            <label for="expenseDescription">Keterangan</label>
            <input id="expenseDescription" type="text" placeholder="Beli dekorasi kelas" required style="border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: rgba(255, 255, 255, 0.9); font-size: 0.95rem; width: 100%;" />
          </div>

          <div class="field-group">
            <label for="expenseDate">Tanggal</label>
            <input id="expenseDate" type="date" required style="border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: rgba(255, 255, 255, 0.9); font-size: 0.95rem; width: 100%;" />
          </div>

          <p id="expenseError" class="form-error hidden"></p>

          <div class="modal-actions">
            <button type="button" class="secondary-btn" data-close-modal="expenseModal">Batal</button>
            <button type="submit" class="primary-btn" id="expenseSubmitBtn">Simpan Pengeluaran</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal hidden" aria-hidden="true">
      <div class="modal-card">
        <div class="modal-head">
          <h3>Login</h3>
          <button type="button" class="close-btn" data-close-modal="loginModal">×</button>
        </div>
        <form id="loginForm">
          <div class="field-group">
            <label for="loginUsername">Username</label>
            <input id="loginUsername" name="username" type="text" placeholder="Masukkan username" required autocomplete="username" />
          </div>
          <div class="field-group">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" name="password" type="password" placeholder="••••••••" required autocomplete="current-password" />
          </div>
          <p id="loginError" class="form-error hidden">Username atau password salah.</p>
          <div class="modal-actions">
            <button type="button" class="secondary-btn" data-close-modal="loginModal">Batal</button>
            <button type="submit" class="primary-btn" id="loginSubmitBtn">Masuk</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="kas-app.js"></script>
  </body>
</html>
