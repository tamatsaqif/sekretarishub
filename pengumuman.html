<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pengumuman — 9 SCP 2</title>
    <meta name="description" content="Papan pengumuman kelas 9 SCP 2: informasi terbaru, jadwal kegiatan, dan arsip catatan kelas." />
    <meta name="theme-color" content="#F8F8F8" />
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  </head>
  <body>
    <canvas id="gridPulseCanvas" aria-hidden="true"></canvas>

    <!-- UNIFIED HEADER -->
    <header id="siteHeader" class="site-header"></header>

    <div class="app-shell">
      <!-- PAGE HEADER -->
      <section class="page-header">
        <div class="page-header-top">
          <div class="page-tag">
            <svg class="icon-svg mini" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span>Pengumuman</span>
          </div>
          <span id="announcementCountBadge" class="text-secondary" style="font-size: 0.875rem; font-weight: 500;">0 Pengumuman</span>
        </div>
        <div style="display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
          <div>
            <h1>Papan Pengumuman Kelas</h1>
            <p class="page-description">Informasi penting, agenda kelas, instruksi guru, dan arsip pemberitahuan.</p>
          </div>
          <button id="addAnnouncementModalBtn" class="btn-primary admin-only hidden" type="button">
            <svg class="icon-svg mini" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>Buat Pengumuman</span>
          </button>
        </div>
      </section>

      <!-- SEARCH & FILTER -->
      <section style="margin-bottom: 20px;">
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <!-- Filter Tabs -->
          <div class="filter-pills" id="announcementFilterPills">
            <button type="button" class="filter-pill active" data-filter="all">Semua</button>
            <button type="button" class="filter-pill" data-filter="Penting">Penting</button>
            <button type="button" class="filter-pill" data-filter="Kegiatan">Kegiatan</button>
            <button type="button" class="filter-pill" data-filter="Info">Informasi Umum</button>
            <button type="button" class="filter-pill" data-filter="archive">Arsip</button>
          </div>

          <!-- Search Box -->
          <div class="search-box">
            <svg class="icon-svg mini search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input id="announcementSearchInput" type="search" placeholder="Cari judul atau isi pengumuman..." aria-label="Cari pengumuman" />
            <button id="clearAnnouncementSearchBtn" class="search-clear-btn hidden" type="button">×</button>
          </div>
        </div>
      </section>

      <!-- ANNOUNCEMENTS LIST CONTAINER -->
      <section>
        <div id="announcementsContainer" class="stack-list">
          <div class="loading-state">Memuat pengumuman...</div>
        </div>
      </section>
    </div>

    <!-- ANNOUNCEMENT DRAWER (Tambah) -->
    <div id="announcementDrawer" class="drawer-backdrop" aria-hidden="true">
      <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="announcementDrawerTitle">
        <div class="drawer-head">
          <div class="drawer-title-group">
            <span class="drawer-tag">Formulir</span>
            <h3 id="announcementDrawerTitle">Buat Pengumuman Baru</h3>
          </div>
          <button type="button" class="drawer-close-btn" id="closeAnnouncementDrawerBtn" aria-label="Tutup formulir">×</button>
        </div>
        <form id="announcementDrawerForm" class="drawer-form">
          <div class="drawer-body">
            <div class="field-group">
              <label for="announcementTitleInput">Judul Pengumuman</label>
              <input id="announcementTitleInput" type="text" placeholder="Contoh: Jadwal Ujian Tengah Semester..." required />
            </div>

            <div class="field-group">
              <label for="announcementTagInput">Kategori / Tag</label>
              <select id="announcementTagInput" required>
                <option value="Info">Informasi Umum</option>
                <option value="Penting">Penting</option>
                <option value="Kegiatan">Kegiatan</option>
              </select>
            </div>

            <div class="field-group">
              <label for="announcementContentInput">Isi Pengumuman</label>
              <textarea id="announcementContentInput" rows="5" placeholder="Tuliskan detail informasi pengumuman secara jelas..." required></textarea>
            </div>
          </div>
          <div class="drawer-footer">
            <button type="button" class="btn-secondary" id="cancelAnnouncementDrawerBtn">Batal</button>
            <button type="submit" class="btn-primary" id="saveAnnouncementSubmitBtn">Publikasikan</button>
          </div>
        </form>
      </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <script type="module">
      import {
        formatDate,
        escapeHtml,
        showToast,
        initGridPulse,
        setupNavigation
      } from "./shared.js";
      import { fetchAnnouncements, insertAnnouncement, deleteAnnouncement } from "./supabase.js";

      initGridPulse();
      setupNavigation("pengumuman");

      const STORAGE_KEY = "sekretaris9scp2-announcements-local";
      const DEFAULT_ANNOUNCEMENTS = [
        {
          id: "a-1",
          title: "Format Daily Class Info Baru",
          tag: "Penting",
          content: "Sistem Daily Class Info kini telah diperbarui dengan tampilan Apple/iOS monochrome baru yang lebih bersih, cepat, dan mudah dibaca di ponsel.",
          created_at: "2026-09-21T08:00:00Z"
        },
        {
          id: "a-2",
          title: "Iuran Kas Kelas Mingguan",
          tag: "Info",
          content: "Iuran kas kelas sebesar Rp 5.000 per minggu tetap berjalan normal. Pembayaran dapat dikonfirmasi langsung ke bendahara kelas.",
          created_at: "2026-09-14T07:30:00Z"
        },
        {
          id: "a-3",
          title: "Kelengkapan Perlengkapan Olahraga",
          tag: "Kegiatan",
          content: "Diharapkan seluruh siswa membawa seragam dan perlengkapan olahraga lengkap pada hari Selasa dan Jumat sesuai jadwal PJOK.",
          created_at: "2026-09-07T06:45:00Z"
        }
      ];

      let announcements = [];
      let currentFilter = "all";

      const announcementsContainer = document.querySelector("#announcementsContainer");
      const announcementCountBadge = document.querySelector("#announcementCountBadge");
      const announcementFilterPills = document.querySelector("#announcementFilterPills");
      const announcementSearchInput = document.querySelector("#announcementSearchInput");
      const clearAnnouncementSearchBtn = document.querySelector("#clearAnnouncementSearchBtn");

      const addAnnouncementModalBtn = document.querySelector("#addAnnouncementModalBtn");
      const announcementDrawer = document.querySelector("#announcementDrawer");
      const announcementDrawerForm = document.querySelector("#announcementDrawerForm");
      const announcementTitleInput = document.querySelector("#announcementTitleInput");
      const announcementTagInput = document.querySelector("#announcementTagInput");
      const announcementContentInput = document.querySelector("#announcementContentInput");
      const closeAnnouncementDrawerBtn = document.querySelector("#closeAnnouncementDrawerBtn");
      const cancelAnnouncementDrawerBtn = document.querySelector("#cancelAnnouncementDrawerBtn");

      function saveLocal() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(announcements));
      }

      function loadLocal() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) return JSON.parse(raw);
        } catch {}
        return DEFAULT_ANNOUNCEMENTS;
      }

      function renderAnnouncements() {
        const query = announcementSearchInput.value.trim().toLowerCase();
        clearAnnouncementSearchBtn.classList.toggle("hidden", query.length === 0);

        announcementCountBadge.textContent = `${announcements.length} Pengumuman`;

        let filtered = [...announcements];

        if (currentFilter === "archive") {
          // older than 14 days or just all as archive
          filtered = filtered.slice(2);
        } else if (currentFilter !== "all") {
          filtered = filtered.filter((a) => a.tag === currentFilter);
        }

        if (query) {
          filtered = filtered.filter(
            (a) => a.title.toLowerCase().includes(query) || a.content.toLowerCase().includes(query)
          );
        }

        if (!filtered.length) {
          announcementsContainer.innerHTML = `
            <div class="empty-state">
              <p>Tidak ada pengumuman dalam kategori ini.</p>
            </div>
          `;
          return;
        }

        announcementsContainer.innerHTML = filtered
          .map((a) => {
            const dateStr = formatDate(new Date(a.created_at || Date.now()));
            return `
              <article class="card-panel" style="display: flex; flex-direction: column; gap: 10px;">
                <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
                  <div>
                    <span class="filter-pill active" style="font-size: 0.6875rem; padding: 2px 8px; margin-bottom: 6px;">${escapeHtml(a.tag || "Info")}</span>
                    <h3 style="font-size: 1.05rem;">${escapeHtml(a.title)}</h3>
                  </div>
                  <span class="text-muted" style="font-size: 0.75rem; white-space: nowrap;">${dateStr}</span>
                </div>
                <p style="font-size: 0.9rem; line-height: 1.55; color: var(--ink-secondary); white-space: pre-line;">${escapeHtml(a.content)}</p>
                <div class="admin-only hidden" style="padding-top: 8px; border-top: 1px solid var(--line-subtle); display: flex; justify-content: flex-end;">
                  <button type="button" class="btn-ghost btn-sm" data-action="delete" data-id="${a.id}">Hapus</button>
                </div>
              </article>
            `;
          })
          .join("");
      }

      announcementFilterPills.addEventListener("click", (e) => {
        const btn = e.target.closest(".filter-pill");
        if (!btn) return;
        announcementFilterPills.querySelectorAll(".filter-pill").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter || "all";
        renderAnnouncements();
      });

      announcementSearchInput.addEventListener("input", renderAnnouncements);
      clearAnnouncementSearchBtn.addEventListener("click", () => {
        announcementSearchInput.value = "";
        renderAnnouncements();
        announcementSearchInput.focus();
      });

      announcementsContainer.addEventListener("click", async (e) => {
        const btn = e.target.closest("button[data-action='delete']");
        if (!btn) return;
        const id = btn.dataset.id;
        if (!confirm("Hapus pengumuman ini?")) return;

        try {
          await deleteAnnouncement(id);
        } catch {}
        announcements = announcements.filter((a) => a.id !== id);
        saveLocal();
        showToast("Pengumuman berhasil dihapus.");
        renderAnnouncements();
      });

      function openDrawer() {
        announcementDrawer.classList.add("is-open");
        announcementDrawer.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      }

      function closeDrawer() {
        announcementDrawer.classList.remove("is-open");
        announcementDrawer.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
        announcementDrawerForm.reset();
      }

      addAnnouncementModalBtn.addEventListener("click", openDrawer);
      closeAnnouncementDrawerBtn.addEventListener("click", closeDrawer);
      cancelAnnouncementDrawerBtn.addEventListener("click", closeDrawer);
      announcementDrawer.addEventListener("click", (e) => {
        if (e.target === announcementDrawer) closeDrawer();
      });

      announcementDrawerForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const title = announcementTitleInput.value.trim();
        const tag = announcementTagInput.value;
        const content = announcementContentInput.value.trim();

        if (!title || !content) return;

        try {
          const created = await insertAnnouncement({ title, tag, content });
          announcements.unshift(created);
          showToast("Pengumuman berhasil dipublikasikan!");
        } catch (err) {
          console.error("Save announcement error:", err);
          announcements.unshift({
            id: `a-${Date.now()}`,
            title,
            tag,
            content,
            created_at: new Date().toISOString()
          });
          showToast("Pengumuman disimpan secara lokal.");
        }

        saveLocal();
        renderAnnouncements();
        closeDrawer();
      });

      async function loadData() {
        announcements = loadLocal();
        try {
          const fetched = await fetchAnnouncements();
          if (fetched && fetched.length) {
            announcements = fetched;
            saveLocal();
          }
        } catch {}
        renderAnnouncements();
      }

      announcements = loadLocal();
      renderAnnouncements();
      loadData();
    </script>
  </body>
</html>
